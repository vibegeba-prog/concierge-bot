name: ИИ-Консьерж УК Мир

on:
  schedule:
    # Утро 9:00 МСК: вт, чт
    - cron: '0 6 * * 2,4'
    # Вечер 19:30 МСК: пн, ср, пт
    - cron: '30 16 * * 1,3,5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Какой пост опубликовать (с учётом разрешённых дней)'
        required: true
        default: morning
        type: choice
        options:
          - morning
          - evening

permissions:
  contents: read

concurrency:
  group: concierge-posting
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Восстановить историю публикаций
        id: history
        uses: actions/cache/restore@v4
        with:
          path: data/posts_log.jsonl
          key: concierge-history-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            concierge-history-v1-${{ github.ref_name }}-

      - name: Опубликовать пост
        run: python concierge.py --mode "$POST_MODE"
        env:
          POST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '0 6 * * 2,4' && 'morning' || 'evening') }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}

      - name: Сохранить историю публикаций
        if: ${{ always() && hashFiles('data/posts_log.jsonl') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/posts_log.jsonl
          key: ${{ steps.history.outputs.cache-primary-key }}
