name: ИИ-Консьерж УК Мир

on:
  schedule:
    # Утро 9:00 МСК (6:00 UTC) по будням: пн-пт
    - cron: '0 6 * * 1-5'
    # Вечер 20:00 МСК (17:00 UTC): пн, ср, пт
    - cron: '0 17 * * 1,3,5'
  workflow_dispatch:  # ручной запуск для теста

jobs:
  morning:
    if: github.event.schedule == '0 6 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python concierge.py --mode morning
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}

  evening:
    if: github.event.schedule == '0 17 * * 1,3,5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python concierge.py --mode evening
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
